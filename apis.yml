name: Doctolib
description: >-
  Doctolib is a European e-health company founded in 2013 and headquartered in
  Levallois-Perret, France, operating across France, Germany, Italy and the
  Netherlands. It provides an online medical appointment-booking platform and
  practice-management software used by patients and by hundreds of thousands of
  healthcare professionals and facilities. Its product surface spans appointment
  booking, telehealth/video consultation, patient messaging, clinical software,
  patient billing, and the Doctolib Connect integration and single-sign-on
  layer. Doctolib exposes a partner/integration API via an authentication-gated
  developer portal (developers.doctolib.com); it publishes an RFC 9116
  security.txt and runs a public YesWeHack bug-bounty program, an Atlassian
  Statuspage, and an open-source GitHub organization, but does not publish a
  public OpenAPI specification, first-party API SDK, or hosted MCP server.
